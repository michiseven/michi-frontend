name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frontend when source is present
        shell: bash
        run: |
          if [[ ! -f package.json ]]; then
            echo "::warning::Frontend source has not been migrated yet; CI bootstrap only."
            exit 0
          fi
          npm ci
          npm run lint
          npm test
          npm run build
